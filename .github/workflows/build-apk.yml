name: Compiler l'APK

# Se déclenche automatiquement à chaque envoi sur main, et peut aussi être
# lancé manuellement depuis l'onglet « Actions » du dépôt (bouton
# « Run workflow ») sans avoir besoin de pousser un commit.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-debug:
    name: Build APK (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Les machines « ubuntu-latest » de GitHub ont déjà le SDK Android
      # préinstallé (ANDROID_HOME / ANDROID_SDK_ROOT) — inutile d'en
      # installer un second avec une action tierce. On s'assure juste que
      # les licences des paquets que Gradle pourrait avoir besoin de
      # télécharger (build-tools, plateforme 34…) sont acceptées.
      - name: Accepter les licences du SDK Android préinstallé
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Vérifier l'intégrité du wrapper Gradle
        uses: gradle/actions/wrapper-validation@v4

      - name: Autoriser l'exécution de gradlew
        run: chmod +x gradlew

      - name: Compiler l'APK (debug, installable directement)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: ivoiregospel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

  build-release:
    name: Build APK (release, signée)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accepter les licences du SDK Android préinstallé
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Vérifier l'intégrité du wrapper Gradle
        uses: gradle/actions/wrapper-validation@v4

      - name: Autoriser l'exécution de gradlew
        run: chmod +x gradlew

      # Le keystore de signature n'est JAMAIS commité dans le dépôt : il est
      # stocké encodé en base64 dans le secret GitHub
      # RELEASE_KEYSTORE_BASE64, puis décodé ici dans un fichier temporaire
      # propre à cette exécution (effacé avec la machine du job une fois
      # terminé). Tant que ce secret — et les 3 autres secrets de mot de
      # passe/alias — n'ont pas été ajoutés au dépôt (Settings → Secrets and
      # variables → Actions), cette étape ne trouve rien à décoder et
      # app/build.gradle.kts détecte l'absence des variables d'environnement
      # correspondantes : l'APK release produit plus bas est alors simplement
      # NON signé, sans faire échouer le build.
      - name: Préparer le keystore de signature (si le secret est configuré)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Tant que le secret n'a pas été ajouté, cette commande écrit un
          # fichier vide : inoffensif, voir le commentaire ci-dessus.
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" || true

      - name: Compiler l'APK (release)
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: ivoiregospel-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
